appId: com.press.golf
name: Scroll to a control and tap it
---
# Every tap scrolls first. At the largest text size most controls start
# off-screen, and centring keeps the tap off the floating tab bar and, on
# Android, off the system navigation bar below the content.
# Env: TEXT, the control's accessible name (a regex); DIRECTION, UP or DOWN.
- scrollUntilVisible:
    element:
      text: ${TEXT}
    direction: ${DIRECTION}
    centerElement: true
    timeout: 120000
- tapOn: ${TEXT}
