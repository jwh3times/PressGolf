appId: com.press.golf
name: Complete a demo round
---
- runFlow: ../subflows/launch.yml
# A checkpoint for the nightly report: Maestro saves a failing step's screenshot
# and view hierarchy, and an optional step's failure doesn't fail the flow.
# The name is written out because Maestro names those files from this text
# before it substitutes variables.
- extendedWaitUntil:
    visible: __checkpoint home__
    timeout: 500
    optional: true
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: Enter scores, DIRECTION: DOWN } }
- extendedWaitUntil:
    visible: Hole 12
    timeout: 15000
- extendedWaitUntil:
    visible: __checkpoint score_hole__
    timeout: 500
    optional: true
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: Increase score for Marcus, DIRECTION: DOWN } }
- scrollUntilVisible:
    element:
      text: net 3 · par
    direction: DOWN
    timeout: 60000
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: See the damage so far →, DIRECTION: DOWN } }
- extendedWaitUntil:
    visible: Settlement.*
    timeout: 15000
- extendedWaitUntil:
    visible: __checkpoint settle__
    timeout: 500
    optional: true
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: Post to the season ledger, DIRECTION: DOWN } }
# The confirmation is a native alert; wait for it instead of racing it.
- extendedWaitUntil:
    visible: 'Post it|POST IT'
    timeout: 15000
- tapOn: 'Post it|POST IT'
- scrollUntilVisible:
    element:
      text: Season ledger
    direction: DOWN
    timeout: 60000
