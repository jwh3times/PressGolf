appId: com.press.golf
name: Enter a finished card
---
- runFlow: ../subflows/launch.yml
# History labels a round by its short date, and the card is dated today.
- evalScript: ${output.today = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][new Date().getMonth()] + ' ' + new Date().getDate()}
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: Enter a finished card, DIRECTION: DOWN } }
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: 'Enter the card · 4 players.*', DIRECTION: DOWN } }
# The card opens on Format. A new card plays Nassau but not Wolf. "Wolf" is
# also the game's title beside the switch, so tap the switch by id.
- scrollUntilVisible:
    element:
      id: switch-Wolf
    direction: DOWN
    centerElement: true
    timeout: 120000
- tapOn:
    id: switch-Wolf
- tapOn: Score
# The card's cursor starts on hole 1, and the Wolf pick and presses below the
# grid follow the cursor.
- extendedWaitUntil:
    visible: Save card
    timeout: 15000
# A checkpoint for the nightly report: Maestro saves a failing step's screenshot
# and view hierarchy, and an optional step's failure doesn't fail the flow.
# The name is written out because Maestro names those files from this text
# before it substitutes variables.
# Checkpoints come before any scrolling on a screen: a scroll doesn't land on
# the same pixel twice, and the screenshots are compared.
- extendedWaitUntil:
    visible: __checkpoint score_card__
    timeout: 500
    optional: true
- scrollUntilVisible:
    element:
      text: Hole 1, Marcus, empty
    direction: DOWN
    timeout: 60000
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: LONE WOLF.*, DIRECTION: DOWN } }
# The grid's Wolf row, back above the picker, records the pick.
- scrollUntilVisible:
    element:
      text: Wolf, hole 1, Marcus alone
    direction: UP
    timeout: 60000
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: Pressed by Dev, DIRECTION: DOWN } }
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: Against Marcus, DIRECTION: DOWN } }
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: Add a press from hole 1, DIRECTION: DOWN } }
- scrollUntilVisible:
    element:
      text: Dev pressed Marcus · 1 to .*
    direction: UP
    timeout: 60000
# Save sits in the card's banner at the top of the screen.
- runFlow: { file: ../subflows/tap.yml, env: { TEXT: Save card, DIRECTION: UP } }
# Every other box is empty, so saving asks to mark them picked up.
- extendedWaitUntil:
    visible: 'Mark and save|MARK AND SAVE'
    timeout: 15000
- tapOn: 'Mark and save|MARK AND SAVE'
- extendedWaitUntil:
    visible: Back
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: __checkpoint history__
    timeout: 500
    optional: true
# iOS reads a History row as one label and Android shows the date line on its
# own, hence the open ends. The live round is dated today too but is part way
# round; the card has every box filled or picked up, so it reads thru 0 or 18
# depending on whether the group's max score counts a pick-up.
- scrollUntilVisible:
    element:
      text: .*${output.today} · 4 players · thru (0|18)\b.*
    direction: DOWN
    timeout: 60000
