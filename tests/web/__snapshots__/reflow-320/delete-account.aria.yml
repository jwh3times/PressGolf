- text: Account Delete account
- button "Done"
- text: "This deletes golfer@example.com and everything it owns from the server, straight away. There is no grace period, and it can’t be undone. What goes Your groups, rosters and rounds. Your hole notes. Your clubs and usual score. Outings you organised, for everyone, including scores guests typed. Guests keep what’s already on their phones. What stays Scores you typed into someone else’s card stay with them. Courses you added stay in the course library for everyone, with their tees, greens and maps, no longer marked as yours. Anyone with a round or outing of their own on your group keeps it, with their own copy of the players they could already see. Your phones This phone goes back to first run: your rounds, bag and tournament rounds on it are erased, and you’re signed out. The demo data stays. Other phones signed in to this account lose access, but keep what’s on them until the app is removed or its data is erased. Password"
- textbox "Password"
- text: Enter your password to confirm.
- button "Delete my account" [disabled]
- button "Keep my account"