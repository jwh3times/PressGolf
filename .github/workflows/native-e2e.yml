name: Native smoke tests

on:
  schedule:
    # Nightly, away from the top of the hour when hosted runners are busiest.
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  EXPO_PUBLIC_DEMO_MODE: true
  MAESTRO_VERSION: 2.10.0
  MAESTRO_CLI_NO_ANALYTICS: true
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
  MAESTRO_DISABLE_UPDATE_CHECK: true

jobs:
  android:
    name: Android native smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: npm ci

      - name: Generate and build the Android app
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease

      - name: Install Maestro
        run: |
          archive="$RUNNER_TEMP/maestro.zip"
          install_dir="$RUNNER_TEMP/maestro"
          curl --fail --silent --show-error --location \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip \
            --output "$archive"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $archive" | sha256sum --check
          unzip -q "$archive" -d "$install_dir"
          maestro_bin="$(find "$install_dir" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$maestro_bin"
          chmod +x "$maestro_bin"
          echo "$(dirname "$maestro_bin")" >> "$GITHUB_PATH"

      - name: Boot Android and run the round flow
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test --format JUNIT --output maestro-android.xml .maestro/smoke.yml

  ios:
    name: iOS native smoke
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Build the iOS simulator app
        run: npx expo run:ios --configuration Release --device generic --output "$RUNNER_TEMP/press-ios"

      - name: Install Maestro
        run: |
          archive="$RUNNER_TEMP/maestro.zip"
          install_dir="$RUNNER_TEMP/maestro"
          curl --fail --silent --show-error --location \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip \
            --output "$archive"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $archive" | shasum --algorithm 256 --check
          unzip -q "$archive" -d "$install_dir"
          maestro_bin="$(find "$install_dir" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$maestro_bin"
          chmod +x "$maestro_bin"
          echo "$(dirname "$maestro_bin")" >> "$GITHUB_PATH"

      - name: Boot iOS and run the round flow
        run: |
          device_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$device_id"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          app_path="$(find "$RUNNER_TEMP/press-ios" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          maestro test --format JUNIT --output maestro-ios.xml .maestro/smoke.yml
