name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to the same branch makes the first one irrelevant — except on
# main, where a run may be applying migrations and must be left alone.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Tests, types, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Patch coverage compares the pull request with its merge base.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm run test:coverage

      - name: New code is covered
        if: github.event_name == 'pull_request'
        run: node scripts/check-patch-coverage.mjs "origin/${{ github.base_ref }}" 90

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx oxlint

      # The net under Dependabot. Expo pins its packages to the SDK, and a
      # bump that leaves the set disagreeing shows up here rather than on a
      # phone on the first tee.
      - name: Expo SDK agrees with itself
        run: npx expo-doctor

  bundle:
    name: Expo production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_DEMO_MODE: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # TypeScript cannot catch Metro resolution, Babel, asset, or production
      # transform failures. Export the same native bundles EAS will consume.
      - name: Export Android and iOS bundles
        run: npx expo export --platform all --output-dir "$RUNNER_TEMP/expo-export"

  database:
    name: Migrations and row-level security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The migrations are applied to a throwaway database on every pull request,
    # so a broken one is caught here rather than against real rounds.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: press
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d press -v ON_ERROR_STOP=1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Stand in for what Supabase provides
        run: $PSQL -q -f supabase/ci/stubs.sql

      - name: Apply every migration, in order
        run: |
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            echo "── $file"
            $PSQL -q -f "$file"
          done

      - name: Apply them again, to prove the baseline is safe to repeat
        run: $PSQL -q -f supabase/migrations/20260921000000_initial_schema.sql

      - name: Row-level security holds two accounts apart
        run: $PSQL -f supabase/ci/rls-test.sql

  migrate:
    name: Apply migrations to Supabase
    # Only once the tests and the throwaway database both agree, and only for
    # something that actually landed on main.
    needs: [checks, bundle, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A no-op when the project has already seen everything in the folder, so
      # this runs on every merge rather than guessing from changed paths.
      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase db push \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
