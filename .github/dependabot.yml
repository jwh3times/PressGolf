version: 2

updates:
  # ── The app ────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      # Identical rules to America/Kentucky/Monticello, and certain to be
      # recognised. Without this the default is UTC, which would be midnight.
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps(dev)

    # ── What Expo owns, and we do not ──────────────────────────────────────────
    # The version of these is not ours to choose. Expo pins them to the SDK, and
    # the only correct way to move them is `npx expo install --fix` when the SDK
    # itself moves. Dependabot offering react-native 0.87 the day it ships is not
    # an upgrade — it is a version Expo has never shipped against.
    #
    # Grouping cannot prevent that on its own: on the day react-native 0.87 lands,
    # `expo` has no update to be grouped with it, so the group arrives holding
    # only the React Native half. Hence ignores as well as groups.
    #
    # Whether a patch is safe depends on how Expo pins the package, which is not
    # uniform. `react`, `react-dom` and `react-native` are pinned to an exact
    # version, so no bump of them is safe at all. The rest are pinned with `~`
    # to a minor, so a patch inside it is fine and still comes through.
    ignore:
      # Pinned by Expo to an exact version, so there is no safe bump of them —
      # not even a patch. react 19.2.3 to 19.2.8 is as small as an update gets
      # and expo-doctor still refused it. No update-types here, which ignores
      # every one.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "@react-native-async-storage/*"

      # Pinned with `~` to a minor instead, so a patch inside that minor is
      # exactly what the SDK expects and is left to come through. Covers
      # react-native-web at ~0.21.0, gesture-handler, screens, safe-area-context.
      #
      # The glob also catches packages Expo pins exactly — react-native-svg,
      # react-native-reanimated and a dozen others — for which a patch would slip
      # past this rule. None of them is a direct dependency today. If one becomes
      # a direct dependency, name it in the exact list above; expo-doctor is the
      # net in the meantime.
      - dependency-name: react-native-*
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-minor, version-update:semver-major]

      # jest-expo@57 is a jest 29 preset: it depends on babel-jest,
      # jest-environment-jsdom and jest-snapshot at ^29. A jest 30 runner over
      # jest 29 internals is the sort of mismatch a green suite can miss, so jest
      # waits for the jest-expo that comes with the next SDK.
      - dependency-name: jest
        update-types: [version-update:semver-major]
      - dependency-name: "@types/jest"
        update-types: [version-update:semver-major]

      # test-renderer 1.3 depends on react-reconciler 0.34, which wants React
      # 19.3 — a React the SDK does not ship. 1.2 is the line built for 19.2.
      # Patches within it still come through; the rest waits for the SDK.
      - dependency-name: test-renderer
        update-types: [version-update:semver-minor, version-update:semver-major]

      # Expo's own packages move within an SDK constantly and those are welcome.
      # A major is the SDK upgrade itself — a deliberate act, with a changelog to
      # read first, not something to meet at 05:00 as an open pull request.
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: expo-*
        update-types: [version-update:semver-major]
      - dependency-name: "@expo/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@expo-google-fonts/*"
        update-types: [version-update:semver-major]
      - dependency-name: babel-preset-expo
        update-types: [version-update:semver-major]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major]

    groups:
      # Expo pins these to the SDK. They are meant to move together, via
      # `npx expo install --fix` on an SDK upgrade, and bumping one on its own
      # is how a project ends up with a version Expo never shipped against.
      # Grouped into a single pull request so they are judged as one decision —
      # and CI runs expo-doctor, which fails the moment the set stops agreeing.
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - "@expo-google-fonts/*"
          - babel-preset-expo
          - jest-expo
          - eslint-config-expo
          - react
          - react-dom
          - react-native
          - react-native-*
          - "@react-native-async-storage/*"
          - "@types/react"

      # Everything that only affects the build, never the app people carry
      # round a golf course.
      tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - expo
          - expo-*
          - "@expo/*"
          - "@expo-google-fonts/*"
          - babel-preset-expo
          - jest-expo
          - eslint-config-expo
          - react
          - react-dom
          - react-native
          - react-native-*
          - "@types/react"
        update-types:
          - minor
          - patch

  # ── The workflows ──────────────────────────────────────────────────────────
  # Actions go stale quietly: a deprecated runtime is a warning long before it
  # is a failure, and nobody reads warnings.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
